{
    streams {
        //New object-like style
        good = ${streams.sink} 
        bad = ${streams.sink} 
        
        sink {
          threadPoolSize = 10

          maxBytes = 10000000

          startupCheckInterval = 10 seconds
          retryInterval = 10 seconds
          buffer = ${streams.buffer}
          gcpUserAgent {
            productName = "Snowplow OSS"
            productVersion = "collector"
          }
        }

        buffer {
          byteLimit = 100000
          recordLimit = 40
          timeLimit = 1000
        }
    }
}
