{
    streams {
        //New object-like style
        good = ${streams.sink} 
        bad = ${streams.sink} 
        
        sink {
          threadPoolSize = 10

          maxBytes = ${snowplow.defaults.sinks.pubsub.maxRecordSize}

          startupCheckInterval = 10 seconds
          retryInterval = 10 seconds
          buffer = ${streams.buffer}
        }

        buffer {
          byteLimit = 100000
          recordLimit = 40
          timeLimit = 1000
        }
    }
}
